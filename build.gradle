plugins {
    id 'java'
}

version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
    // Mindustry on Android only loads mod classes targeting Java 8
    options.release = 8
}

dependencies {
    compileOnly files('libs/Mindustry.jar')
}

sourceSets.main.resources.srcDir '.'
processResources {
    include 'mod.json', 'icon.png'
}

jar {
    archiveFileName = 'michat.jar'
}
