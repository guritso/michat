plugins {
    id 'java'
}

version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly files('libs/Mindustry.jar')
}

sourceSets.main.resources.srcDir '.'
processResources {
    include 'mod.json', 'icon.png'
}

jar {
    archiveFileName = 'michat.jar'
}
