name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: gradle build
      - name: Package mod
        run: |
          mkdir -p release
          cp mod.hjson release/
          cp build/libs/michat.jar release/
          cd release
          zip -r ../michat.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: michat.zip
