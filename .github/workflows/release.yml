name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Mindustry API
        run: |
          mkdir -p libs
          curl -L --fail https://github.com/Anuken/Mindustry/releases/download/v146/server-release.jar -o libs/Mindustry.jar
      - run: gradle build
      - name: Package mod
        run: |
          mkdir -p release
          cp mod.json release/
          cp build/libs/michat.jar release/
          cp build/libs/michat.jar michat.jar
          cd release
          zip -r ../michat.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            michat.jar
            michat.zip
