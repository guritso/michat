name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Mindustry API
        run: |
          mkdir -p libs
          curl -L --fail https://github.com/Anuken/Mindustry/releases/download/v160.7/server-release.jar -o libs/Mindustry.jar
      - run: gradle build
      - name: Build dex for Android
        run: |
          D8=$(ls $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -1)
          mkdir -p build/dex
          "$D8" --release --min-api 21 --output build/dex $(find build/classes/java/main -name '*.class')
          (cd build/dex && zip ../libs/michat.jar classes.dex)
      - name: Package mod
        run: |
          mkdir -p release
          cp mod.json release/
          cp icon.png release/
          cp build/libs/michat.jar release/
          cp build/libs/michat.jar michat.jar
          cd release
          zip -r ../michat.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            michat.jar
            michat.zip
